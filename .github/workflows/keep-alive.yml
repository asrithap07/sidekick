name: Keep Sidekick Alive

# Runs every Sunday and Wednesday at 12:00 UTC — twice a week is a safe
# buffer against the 7-day inactivity pause (adjust the cron if you want).
on:
  schedule:
    - cron: '0 12 * * 0,3'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s -o /dev/null -w "Status: %{http_code}\n" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/tasks?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"